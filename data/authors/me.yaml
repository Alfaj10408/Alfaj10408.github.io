experience:
  - role: Graduate Research Assistant · Leslie A. Geddes Fellow
    org: Weldon School of Biomedical Engineering, Purdue University
    start: 2025-08-01
    summary: |
      - **Long-horizon LLM execution** (under review at ICLR 2027): built an exact-simulator evaluation that separates correct responses from decision errors, state errors, token exhaustion, malformed outputs, and noncompliance; ran 800-sample reasoning-on/off grids on Qwen3 models served through vLLM on dual-GPU nodes with Clopper–Pearson and clustered uncertainty estimates. Reasoning mode collapsed move-selection errors from roughly 60% to 0% while leaving state-transcription errors unchanged; position labels cut Qwen3-4B state errors from 50.6% to 0.6%.
      - Built the harness behind those results: 810 automated tests, SHA-256-pinned verbatim prompts, parser audits, token-budget controls, and resumable grid runners for unattended multi-day GPU sweeps.
      - **Vision-language grounding** (manuscript in final preparation for CVPR 2027): characterized the "mirage" failure in which VLMs answer confidently from blank or unrelated images and evaluated TIDE across six VLMs with an image-aware judge; fine-tuned Qwen3-VL at 2B/4B/8B/32B with 4-bit QLoRA and traced an apparent scale trend to a projector co-scaling artifact.
      - **Neuromorphic sensing interfaces** (under review at ICASSP 2027): showed that rate readout from leak-free spiking front-ends discards temporal information and proposed MoHI, a moment-based spiking-to-analog handoff equivariant to affine time warps.
      - **Dissertation**: designing a mask-conditional latent diffusion model in a VQ-VAE latent space with ControlNet-style conditioning on radiologist-delineated lesion masks for rare-lesion detection; IRB-approved clinical data collection with pediatric radiology collaborators at Riley Hospital for Children.
  - role: Software Engineer L2 — Backend and ML Infrastructure
    org: Augmedix
    start: 2022-07-01
    end: 2025-07-31
    summary: |
      - Fine-tuned large language models for clinical note generation using LoRA/PEFT and built the evaluation loop around them: factual-consistency and hallucination checks against source encounter transcripts.
      - Engineered Python and SQL pipelines on AWS carrying high-throughput clinical audio and NLP streams into real-time generative documentation; served models through FastAPI/Django endpoints.
      - Re-architected and migrated legacy services onto Kubernetes with CI/CD, monitoring dashboards, and A/B rollout infrastructure.
  - role: AI Engineer — Generative AI and Computer Vision
    org: IDEEZA (remote)
    start: 2023-09-01
    end: 2025-07-31
    summary: |
      - Trained reward models and applied preference optimization to align generative outputs with human-rated quality; designed LLM-orchestrated workflows routing a request across several generative models.
      - Engineered image-to-3D reconstruction pipelines on Stable Diffusion and ControlNet, deployed at dev-ai-mesh.ideeza.com, with automated quality control scored by FID, SSIM, and LPIPS.
      - Built 3D model generation pipelines on the current state-of-the-art generative 3D models, including TRELLIS, Hunyuan3D, PartSLIP, and PartPacker, producing part-aware 3D assets for downstream design workflows.
      - Developed PCB placement and part placement inside 3D host models, positioning boards and components within the target geometry.
      - Designed agentic, LLM-driven procedural 3D modeling that generates CAD-ready outputs from specifications: STEP, STL, and GLB files and OpenSCAD code.
      - Implemented 3D segmentation, partitioning, and assembly of generated models into part hierarchies.
  - role: Research Engineer — AI Systems
    org: RadAssist
    start: 2022-05-01
    end: 2025-07-31
    summary: |
      - Led R&D on a multi-label CNN classifier identifying 17 radiological findings from chest X-rays, including per-class threshold selection and confidence calibration.
      - Instrumented evaluation pipelines with confusion-matrix analysis, calibration assessment, and systematic failure-mode review; deployed NLP summarization models that translate structured predictions into clinical narratives.

